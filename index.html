<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Industrial design portfolio.">
  <title>Industrial Design Portfolio</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #f5f3ed; }

    .project-nav {
      position: fixed;
      z-index: 10;
      top: 16px;
      left: 50%;
      translate: -50% 0;
      max-width: calc(100vw - 24px);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      background: rgba(30, 31, 27, .46);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .18), inset 0 1px 0 rgba(255, 255, 255, .2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .project-nav a {
      min-height: 34px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      color: rgba(255, 255, 255, .72);
      font: 600 11px/1.2 Arial, Helvetica, sans-serif;
      text-decoration: none;
      white-space: nowrap;
    }

    .project-nav a:hover,
    .project-nav a:focus-visible,
    .project-nav a[aria-current="true"] {
      color: #fff;
      border-radius: 999px;
      background: rgba(255, 255, 255, .18);
      outline: none;
    }

    main { width: 100%; }
    .page { display: block; width: 100%; height: auto; }
    .project-start { scroll-margin-top: 72px; }

    @media (max-width: 680px) {
      .project-nav {
        left: 12px;
        right: 12px;
        translate: 0 0;
        overflow-x: auto;
        justify-content: flex-start;
        scrollbar-width: none;
      }
      .project-nav::-webkit-scrollbar { display: none; }
      .project-nav a { padding-inline: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <nav class="project-nav" aria-label="Projects">
    <a href="#museum">Museum</a>
    <a href="#wildling-perch">Wildling Perch</a>
    <a href="#follicra">Follicra</a>
    <a href="#deltaforge">Deltaforge</a>
  </nav>

  <main>
    <img class="page" src="assets/pages/cover-1.jpg" alt="Portfolio cover" width="2200" height="1556">
    <img class="page" src="assets/pages/cover-2.jpg" alt="Portfolio introduction" width="2200" height="1556">

    <img class="page project-start" id="museum" src="assets/pages/m1.jpg" alt="Serendipity at the Museum project opening" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/m2.jpg" alt="Serendipity at the Museum project page 2" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/m3.jpg" alt="Serendipity at the Museum project page 3" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/m4.jpg" alt="Serendipity at the Museum project page 4" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/m5.jpg" alt="Serendipity at the Museum project page 5" width="2200" height="1556" loading="lazy">

    <img class="page project-start" id="wildling-perch" src="assets/pages/f1.jpg" alt="Wildling Perch project opening" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/f2.jpg" alt="Wildling Perch project page 2" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/f3.jpg" alt="Wildling Perch project page 3" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/f5.jpg" alt="Wildling Perch project page 4" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/f6.jpg" alt="Wildling Perch project page 5" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/f7.jpg" alt="Wildling Perch project page 6" width="2200" height="1556" loading="lazy">

    <img class="page project-start" id="follicra" src="assets/pages/p1.jpg" alt="Follicra project opening" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/p3.jpg" alt="Follicra project page 2" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/p4.jpg" alt="Follicra project page 3" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/p5.jpg" alt="Follicra project page 4" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/p6.jpg" alt="Follicra project page 5" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/p7.jpg" alt="Follicra project page 6" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/p8.jpg" alt="Follicra project page 7" width="2200" height="1556" loading="lazy">

    <img class="page project-start" id="deltaforge" src="assets/pages/a1.jpg" alt="Deltaforge project opening" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/a2.jpg" alt="Deltaforge project page 2" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/a3.jpg" alt="Deltaforge project page 3" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/a4.jpg" alt="Deltaforge project page 4" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/a5.jpg" alt="Deltaforge project page 5" width="2200" height="1556" loading="lazy">
    <img class="page" src="assets/pages/a6.jpg" alt="Deltaforge project page 6" width="2200" height="1556" loading="lazy">
  </main>

  <script>
    const links = [...document.querySelectorAll('.project-nav a')];
    const starts = links.map((link) => document.querySelector(link.hash));
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        links.forEach((link) => link.removeAttribute('aria-current'));
        const active = links.find((link) => link.hash === `#${entry.target.id}`);
        if (active) active.setAttribute('aria-current', 'true');
      });
    }, { rootMargin: '-20% 0px -70% 0px' });
    starts.forEach((start) => observer.observe(start));
  </script>
</body>
</html>
